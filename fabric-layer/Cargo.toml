[package]
name = "fabric-layer"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false
description = "A Fabric mod loader front end in Rust: reads Fabric mod jars, resolves their dependencies and entrypoints, and reports what Minecraft API and Mixin targets they need. The first part of a layer that lets Fabric mods run on Horizon."

[[bin]]
name = "fabric-inspect"
path = "src/main.rs"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
zip = { version = "2", default-features = false, features = ["deflate"] }

[workspace]
