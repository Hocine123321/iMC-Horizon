name: Type sizes (diagnostic)

# Not part of the app build: prints how big the engine's largest types are (rustc -Zprint-type-sizes on
# horizon-client for iOS) as a check-run annotation, to find what fills the startup stack
# (docs/IOS_CRASH_STACK.md). Run it by hand: Actions > Type sizes (diagnostic) > Run workflow.
on:
  workflow_dispatch:

jobs:
  sizes:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      IPHONEOS_DEPLOYMENT_TARGET: "16.0"
      RUSTC_BOOTSTRAP: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
          rustup target add aarch64-apple-ios
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: horizon
          shared-key: app-aarch64-apple-ios
          save-if: "false"
      - name: Print type sizes
        working-directory: horizon
        run: |
          cargo rustc --locked --release --target aarch64-apple-ios -p horizon-client --lib -- -Zprint-type-sizes 2>&1 | tee ../sizes.log | tail -3
      - name: Largest types as an annotation
        if: always()
        run: |
          [ -f sizes.log ] || exit 0
          python3 - <<'PY'
          import re
          rows = {}
          for line in open("sizes.log", errors="replace"):
              m = re.match(r"print-type-size type: `(.+?)`: (\d+) bytes, alignment: (\d+) bytes", line)
              if m:
                  rows[m.group(1)] = max(rows.get(m.group(1), 0), int(m.group(2)))
          top = sorted(rows.items(), key=lambda kv: -kv[1])[:70]
          text = "|".join(f"{n[:110]} = {s // 1024} KB ({s})" for n, s in top)
          print("::notice title=largest types::" + text.replace("%", "%25"))
          want = ("Game", "Renderer", "Options", "Settings", "Loaded", "Handoff", "UiResources", "PackResources",
                  "Audio", "GameCpuResources", "Split", "Loading", "ModPhase", "Streaming", "ParticleEngine")
          sel = [(n, s) for n, s in rows.items() if n.split("::")[-1].split("<")[0] in want and s >= 2048]
          sel = sorted(sel, key=lambda kv: -kv[1])[:50]
          print("::notice title=named types::" + "|".join(f"{n[:110]} = {s // 1024} KB" for n, s in sel).replace("%", "%25"))
          PY
